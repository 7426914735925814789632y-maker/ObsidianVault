name: Auto Organize Obsidian Vault

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    # 無限ループ防止：Actions自身のコミットでは再起動しない
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run vault organization script
        run: python .github/scripts/auto_organize.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-organize vault and update properties [skip ci]"
            git push
          fi
